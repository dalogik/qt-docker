name: Build docker image

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (linux64-gcc or win64-mingw)'
        default: 'linux64-gcc'
        required: true
        type: string
      qt-version:
        description: 'Version of Qt'
        default: '6.11.0'
        required: true
        type: string
      mingw-version:
        description: 'Version of MinGW for Windows targets'
        default: 1310
        required: false
        type: number

env:
  ORG_NAME: 'dalogik'
  IMG_NAME: 'qt-docker'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Generate date suffix
        id: date
        run: echo "yymmdd=$(date -u +'%y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image with Qt${{ inputs.qt-version }} for ${{ inputs.platform }}
        uses: docker/build-push-action@v7
        with:
          file: ${{ inputs.platform }}/Dockerfile
          tags: ${{ env.ORG_NAME }}/${{ env.IMG_NAME }}:qt${{ inputs.qt-version }}-${{ inputs.platform }}-${{ steps.date.outputs.yymmdd }}-gh
          push: true
          sbom: true
          provenance: true
          build-args: |
            QT_VERSION=${{ inputs.qt-version }}
            ${{ inputs.platform == 'win64-mingw' && format('MINGW_VERSION={0}', inputs.mingw-version) || '' }}
