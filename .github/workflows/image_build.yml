name: Build docker image

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (linux64-gcc or win64-mingw)'
        default: 'linux64-gcc'
        required: true
        type: string
      qt-version:
        description: 'Version of Qt'
        default: '6.11.0'
        required: true
        type: string
      mingw-version:
        description: 'Version of MinGW for Windows targets'
        default: 1310
        required: false
        type: number
      push-image:
        description: 'Whether to push the built image to Docker Hub'
        default: true
        required: false
        type: boolean

env:
  ORG_NAME: 'dalogik'
  IMG_NAME: 'qt-docker'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Generate date suffix
        id: date
        run: echo "yymmdd=$(date -u +'%y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Generate image tag
        id: tag
        run: echo "publish=${{ env.ORG_NAME }}/${{ env.IMG_NAME }}:qt${{ inputs.qt-version }}-${{ inputs.platform }}-${{ steps.date.outputs.yymmdd }}-gh" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: ${{ inputs.push-image == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for tests with Qt${{ inputs.qt-version }} for ${{ inputs.platform }}
        uses: docker/build-push-action@v7
        with:
          file: ${{ inputs.platform }}/Dockerfile
          tags: qt-docker:test
          load: true
          push: false
          cache-to: type=gha,mode=max
          build-args: |
            QT_VERSION=${{ inputs.qt-version }}
            ${{ inputs.platform == 'win64-mingw' && format('MINGW_VERSION={0}', inputs.mingw-version) || '' }}

      - name: Test Docker image for Qt${{ inputs.qt-version }} on ${{ inputs.platform }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/github/workspace" \
            -w /github/workspace \
            qt-docker:test \
            bash -c "test/run.sh"

      - name: Build and push Docker image with Qt${{ inputs.qt-version }} for ${{ inputs.platform }}
        if: ${{ inputs.push-image == 'true' }}
        uses: docker/build-push-action@v7
        with:
          file: ${{ inputs.platform }}/Dockerfile
          tags: ${{ steps.tag.outputs.publish }}
          push: true
          sbom: true
          provenance: true
          cache-from: type=gha
          build-args: |
            QT_VERSION=${{ inputs.qt-version }}
            ${{ inputs.platform == 'win64-mingw' && format('MINGW_VERSION={0}', inputs.mingw-version) || '' }}
